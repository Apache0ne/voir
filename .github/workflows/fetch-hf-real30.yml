name: fetch-hf-real30

on:
  push:
    paths:
      - "scripts/download_hf_real30.py"
      - ".github/workflows/fetch-hf-real30.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip datasets Pillow
      - name: Download thirty real photos from Hugging Face
        run: |
          rm -rf datasets/hf_coco_real30
          python scripts/download_hf_real30.py \
            --dataset detection-datasets/coco \
            --split train \
            --count 30 \
            --output datasets/hf_coco_real30
      - name: Commit dataset snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/hf_coco_real30
          if git diff --cached --quiet; then
            echo "Dataset snapshot already current"
          else
            git commit -m "Add HF COCO real30 photo set"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hf-coco-real30
          path: datasets/hf_coco_real30
          if-no-files-found: error
