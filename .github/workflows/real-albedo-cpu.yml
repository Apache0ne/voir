name: real-albedo-cpu

on:
  pull_request:
    paths:
      - "voir/**"
      - "scripts/download_hf_real30.py"
      - "scripts/train_real_olbedo_cpu.py"
      - "scripts/train_real_olbedo_cpu_focused.py"
      - "scripts/train_real_olbedo_cpu_crossval.py"
      - "scripts/train_real_olbedo_cpu_crossval_w32.py"
      - "tests/**"
      - ".github/workflows/real-albedo-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-real30:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Download balanced real RGB/albedo pairs
        run: |
          python scripts/download_hf_real30.py \
            --dataset GDAOSU/Olbedo \
            --split train_selected \
            --count 30 \
            --train-count 24 \
            --output datasets/hf_olbedo_real30
      - name: Validate dataset
        run: |
          test "$(find datasets/hf_olbedo_real30/images -name '*.png' | wc -l)" -eq 30
          test "$(find datasets/hf_olbedo_real30/albedo -name '*.png' | wc -l)" -eq 30
          test "$(find datasets/hf_olbedo_real30/masks -name '*.png' | wc -l)" -eq 30
          test "$(wc -l < datasets/hf_olbedo_real30/pairs.jsonl)" -eq 30
      - name: Unit tests
        run: pytest
      - name: Five-fold group-held-out width32 training and deployment ensemble
        run: python scripts/train_real_olbedo_cpu_crossval_w32.py
      - name: Show report
        run: cat outputs/real_olbedo_cpu_v3_crossval/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: voir-real-olbedo-cpu-v3-crossval-w32
          path: |
            outputs/real_olbedo_cpu_v3_crossval
            datasets/hf_olbedo_real30/metadata.json
            datasets/hf_olbedo_real30/pairs.jsonl
          if-no-files-found: error
