[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voir-mage-reservoir"
version = "0.2.0"
description = "Standalone Beta plus DPM++ SDE sampling for frozen Mage reservoir states and albedo readouts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Apache0ne"}]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "Pillow>=10.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
mage = [
  "diffusers>=0.35",
  "einops>=0.8",
  "huggingface_hub>=0.34",
  "loguru>=0.7",
  "pydantic>=2.0",
  "safetensors>=0.4",
  "torchsde>=0.2.6",
  "torchvision>=0.19",
  "transformers>=4.55",
]
dev = ["pytest>=8.0"]

[project.scripts]
voir = "voir.cli:main"

[tool.setuptools.packages.find]
include = ["voir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
